name: Verify historical legacy-codec exceptions
on:
  push:
    paths:
      - 'scripts/classify_legacy_codec_exceptions.py'
      - '.github/workflows/legacy-codec-exceptions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict source hash, quotation fallbacks and font test safety
        run: |
          PYTHONPATH=. python scripts/classify_legacy_codec_exceptions.py
          git diff --exit-code -- canonical_translation_v2.csv
          git diff --check
      - name: Commit provenance report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/translation_memory/legacy_codec_exception_policy.json
          if ! git diff --cached --quiet; then
            git commit -m "Classify eight intentional historical legacy-codec exceptions"
            git push origin HEAD:main
          fi
