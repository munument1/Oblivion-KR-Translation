name: Upload unofficial Korean patches to Nexus Mods

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag
        required: true
        default: v1.1.8
        type: string
      patch:
        description: Unofficial patch package
        required: true
        type: choice
        options:
          - UODP
          - UOP

permissions:
  contents: read

concurrency:
  group: nexus-unofficial-${{ inputs.patch }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Select verified package
        id: package
        env:
          PATCH: ${{ inputs.patch }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PATCH" in
            UODP)
              echo 'filename=UODP_KR_UTF8_obCJK_v27_KR1.10_20261025.zip' >> "$GITHUB_OUTPUT"
              echo 'file_id=8036709' >> "$GITHUB_OUTPUT"
              echo 'mod_id=433791753537' >> "$GITHUB_OUTPUT"
              echo 'version=27-KR1.10' >> "$GITHUB_OUTPUT"
              echo 'display_name=UODP KR UTF8 obCJK' >> "$GITHUB_OUTPUT"
              echo 'changelog=대사·일지·서적 21개 필드를 최신 본편·공식 DLC 번역에 맞췄습니다. 실제 패치의 내용 교정과 기존 성소 메시지·서적 복구를 유지합니다. 본편 v1.1.8과 함께 교체하세요.' >> "$GITHUB_OUTPUT"
              ;;
            UOP)
              echo 'filename=UOP_KR_UTF8_obCJK_3.5.9a_KR1.11_20261025.zip' >> "$GITHUB_OUTPUT"
              echo 'file_id=8036688' >> "$GITHUB_OUTPUT"
              echo 'mod_id=433791753535' >> "$GITHUB_OUTPUT"
              echo 'version=3.5.9a-KR1.11' >> "$GITHUB_OUTPUT"
              echo 'display_name=UOP KR UTF8 obCJK' >> "$GITHUB_OUTPUT"
              echo 'changelog=대사·일지·서적·명칭 등 280개 필드를 최신 본편 번역에 맞췄습니다. 북쪽·남쪽과 경갑 훈련 등 실제 UOP 교정을 반영하고 기존 철문 메시지·서적 복구를 유지합니다. 본편 v1.1.8과 함께 교체하세요.' >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
      - name: Download and verify release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          FILENAME: ${{ steps.package.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --pattern "$FILENAME" --pattern "$FILENAME.sha256"
          sha256sum --check "$FILENAME.sha256"
          python -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None; assert all("/" not in n for n in z.namelist() if n.lower().endswith(".esp"))' "$FILENAME"
      - name: Update Nexus file
        id: nexus
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.package.outputs.file_id }}
          mod_id: ${{ steps.package.outputs.mod_id }}
          filename: ${{ steps.package.outputs.filename }}
          version: ${{ steps.package.outputs.version }}
          display_name: ${{ steps.package.outputs.display_name }}
          description: ${{ steps.package.outputs.changelog }}
          changelog: ${{ steps.package.outputs.changelog }}
          category: main
          archive_existing_version: 'false'
          primary_mod_manager_download: 'true'
          allow_mod_manager_download: 'true'
          update_mod_version: 'true'
      - name: Record result
        env:
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
        run: echo "Uploaded Nexus file version $VERSION_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify uploaded Nexus version through API
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
          EXPECTED_FILE: ${{ steps.package.outputs.file_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_ID" =~ ^[0-9]+$ ]]
          curl --fail-with-body --silent --show-error --retry 2 --header "apikey: $NEXUS_API_KEY" "https://api.nexusmods.com/v3/mod-file-versions/$VERSION_ID" --output uploaded.json
          jq -e --arg version "$EXPECTED_VERSION" --arg file "$EXPECTED_FILE" '.data.version == $version and (.data.file.id | tostring) == $file' uploaded.json
          printf 'Verified Nexus version %s (%s), file %s.\n' "$EXPECTED_VERSION" "$VERSION_ID" "$EXPECTED_FILE" >> "$GITHUB_STEP_SUMMARY"
