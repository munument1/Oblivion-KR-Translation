name: Nexus 56688 Book Source QA

on:
  push:
    paths:
      - 'canonical_translation_v2.csv'
      - 'build_vanilla_overlay.py'
      - 'tests/test_nexus_56688_book_sources.py'
      - '.github/workflows/nexus-56688-book-qa.yml'
  pull_request:
    paths:
      - 'canonical_translation_v2.csv'
      - 'build_vanilla_overlay.py'
      - 'tests/test_nexus_56688_book_sources.py'
      - '.github/workflows/nexus-56688-book-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate reported book names and source-scoped replacement
        run: python -m unittest discover -s tests -p 'test_nexus_56688_book_sources.py' -v
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
