name: Historical canonical source audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_canonical_memory.py'
      - '.github/workflows/translation-memory-audit.yml'
      - 'mods/**'
      - 'scripts/reviewed_memory_gate.py'
  pull_request:
    paths:
      - 'mods/**'
      - 'scripts/reviewed_memory_gate.py'
permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Disallow raw historical memory imports in mod builders
        run: |
          python - <<'PY'
          from pathlib import Path
          banned=['canonical_translation_v2.csv','applied_translations_v2.csv','patch_translation_memory.csv']
          bad=[str(p) for p in Path('mods').rglob('*.py') if any(n in p.read_text(encoding='utf-8') for n in banned)]
          if bad:
              raise SystemExit('Unsafe direct legacy canonical use in mod code: '+repr(bad))
          print('No mod builder imports historical canonical source directly')
          PY
      - name: Audit all canonical rows without rewriting them
        run: |
          python scripts/audit_canonical_memory.py --report docs/translation_memory/canonical_risk_audit.json
          python -m unittest discover -s tests -p test_translation_memory_reconciliation.py -v
          git diff --check
      - name: Store audit on main only
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/translation_memory/canonical_risk_audit.json
          if git diff --cached --quiet; then
            echo 'Audit unchanged'
          else
            git commit -m "Document remaining historical canonical review candidates"
            git push origin HEAD:main
          fi
