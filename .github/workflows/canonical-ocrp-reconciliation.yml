name: Canonical OCRP read-only reconciliation validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/reconcile_canonical_ocrp.py'
      - 'issue8_reporter_term_patch.py'
      - 'scripts/reviewed_memory_gate.py'
      - 'tests/test_translation_memory_reconciliation.py'
      - '.github/workflows/canonical-ocrp-reconciliation.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check reviewed matches without rewriting canonical
        run: |
          python -m unittest discover -s tests -p test_translation_memory_reconciliation.py -v
          python scripts/reconcile_canonical_ocrp.py --check --report /tmp/ocrp_canonical_check.json
          python -m unittest discover -s tests -p test_reviewed_semantics.py -v
          python -m unittest discover -s tests -p test_issue8_glossary_exceptions.py -v
          python -m unittest discover -s tests -p test_issue8_remaining_glossary_names.py -v
          python -m unittest discover -s tests -p test_issue8_reporter_terms.py -v
          git diff --exit-code -- canonical_translation_v2.csv
