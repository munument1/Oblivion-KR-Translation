name: Issue 8 Contextual Names QA

on:
  pull_request:
    paths:
      - 'issue8_context_verified_patch.py'
      - 'build_obcjk_release.py'
      - 'tests/test_issue8_context_verified.py'
      - '.github/workflows/issue8-context-names.yml'
  push:
    paths:
      - 'issue8_context_verified_patch.py'
      - 'build_obcjk_release.py'
      - 'tests/test_issue8_context_verified.py'
      - '.github/workflows/issue8-context-names.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real source-anchored contextual terminology and mutation guards
        run: python -m unittest discover -s tests -p 'test_issue8_context_verified.py' -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -q
