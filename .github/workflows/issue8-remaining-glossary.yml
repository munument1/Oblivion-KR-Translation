name: Issue 8 Second Glossary Names QA

on:
  pull_request:
    paths:
      - 'issue8_remaining_term_patch.py'
      - 'canonical_locations_v2.csv'
      - 'build_obcjk_release.py'
      - 'tests/test_issue8_remaining_glossary_names.py'
      - '.github/workflows/issue8-remaining-glossary.yml'
  push:
    paths:
      - 'issue8_remaining_term_patch.py'
      - 'canonical_locations_v2.csv'
      - 'build_obcjk_release.py'
      - 'tests/test_issue8_remaining_glossary_names.py'
      - '.github/workflows/issue8-remaining-glossary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-verified names and zero unrelated changes
        run: python -m unittest discover -s tests -p 'test_issue8_remaining_glossary_names.py' -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -q
