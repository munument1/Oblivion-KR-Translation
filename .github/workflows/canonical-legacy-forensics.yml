name: Canonical remaining legacy-byte forensics
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/forensic_legacy_canonical.py'
      - '.github/workflows/canonical-legacy-forensics.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=. python scripts/forensic_legacy_canonical.py
      - run: git diff --exit-code -- canonical_translation_v2.csv
      - name: Commit read-only case report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/translation_memory/remaining_legacy_encoding_forensics.json
          if ! git diff --cached --quiet; then
            git commit -m "Record legacy-byte canonical mismatches without altering UTF-8 translations"
            git push origin HEAD:main
          fi
