name: Issue 8 Remaining Context Exceptions QA

on:
  pull_request:
    paths:
      - 'issue8_glossary_exceptions.py'
      - 'build_obcjk_release.py'
      - 'tests/test_issue8_glossary_exceptions.py'
      - '.github/workflows/issue8-glossary-exceptions.yml'
  push:
    paths:
      - 'issue8_glossary_exceptions.py'
      - 'build_obcjk_release.py'
      - 'tests/test_issue8_glossary_exceptions.py'
      - '.github/workflows/issue8-glossary-exceptions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-verified exception checks, exact counts and identities
        run: python -m unittest discover -s tests -p 'test_issue8_glossary_exceptions.py' -v
      - name: Full existing QA suite
        run: python -m unittest discover -s tests -q
