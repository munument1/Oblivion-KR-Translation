name: Canonical translation review priority queue
on:
  push:
    paths:
      - 'scripts/build_canonical_review_queue.py'
      - '.github/workflows/canonical-review-queue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare historical proposals with exact canonical keys
        run: |
          PYTHONPATH=. python scripts/build_canonical_review_queue.py
          git diff --exit-code -- canonical_translation_v2.csv
          git diff --check
      - name: Commit read-only prioritized QA queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/translation_memory/canonical_review_priority_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Record prioritized source-context review of canonical discrepancies"
            git push origin HEAD:main
          fi
