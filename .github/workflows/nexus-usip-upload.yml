name: Upload USIP Korean patch to Nexus Mods

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag
        required: true
        default: v1.1.8
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-usip-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and validate published USIP package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          filename='USIP_KR_UTF8_obCJK_1.6.2_KR1.8_20261025.zip'
          gh release download "$RELEASE_TAG" --pattern "$filename" --pattern "$filename.sha256"
          sha256sum --check "$filename.sha256"
          python -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None; assert [n for n in z.namelist() if n.lower().endswith(".esp")] == ["Unofficial Shivering Isles Patch.esp"]' "$filename"

      - name: Resolve existing Nexus mod and file identity
        id: target
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUS_API_KEY"
          # The previous public KR1.5 upload exposes game-scoped version ID 1000046772.
          # Resolve its stable file ID through the authenticated official v3 API.
          version_json=$(curl --fail-with-body --silent --show-error --retry 2 \
            --header "apikey: $NEXUS_API_KEY" \
            'https://api.nexusmods.com/v3/games/oblivion/mod-file-versions/1000046772')
          file_id=$(jq -r '.data.file.id // empty' <<< "$version_json")
          previous_version=$(jq -r '.data.version // empty' <<< "$version_json")
          [[ "$file_id" =~ ^[0-9]+$ ]]
          [[ "$previous_version" == '1.6.2-KR1.5' ]] || { echo 'Unexpected existing USIP version'; exit 1; }
          mod_json=$(curl --fail-with-body --silent --show-error --retry 2 \
            --header "apikey: $NEXUS_API_KEY" \
            'https://api.nexusmods.com/v3/games/oblivion/mods/56640')
          mod_id=$(jq -r '.data.id // empty' <<< "$mod_json")
          mod_name=$(jq -r '.data.name // empty' <<< "$mod_json")
          [[ "$mod_id" =~ ^[0-9]+$ ]]
          [[ "$mod_name" == *'Unofficial Shivering Isles Patch'* ]]
          printf 'file_id=%s\nmod_id=%s\n' "$file_id" "$mod_id" >> "$GITHUB_OUTPUT"

      - name: Update existing Nexus USIP file
        id: nexus
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.target.outputs.file_id }}
          mod_id: ${{ steps.target.outputs.mod_id }}
          filename: USIP_KR_UTF8_obCJK_1.6.2_KR1.8_20261025.zip
          version: 1.6.2-KR1.8
          display_name: Unofficial Shivering Isles Patch KR
          description: 대사·일지·서적 48개 필드를 최신 본편 번역에 맞췄습니다. 실제 USIP의 인물·지역·시간·내용 교정을 보존합니다. 본편 v1.1.8과 함께 업데이트하세요. 게임 내 표시는 미검증입니다.
          changelog: 대사·일지·서적 48개 필드를 최신 본편 번역에 맞췄습니다. 실제 USIP의 인물·지역·시간·내용 교정을 보존합니다. 본편 v1.1.8과 함께 업데이트하세요. 게임 내 표시는 미검증입니다.
          category: main
          archive_existing_version: 'false'
          primary_mod_manager_download: 'true'
          allow_mod_manager_download: 'true'
          update_mod_version: 'true'

      - name: Record upload result
        env:
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
        run: echo "Updated USIP to 1.6.2-KR1.8. Version ID $VERSION_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify uploaded Nexus version through API
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
          EXPECTED_VERSION: 1.6.2-KR1.8
          EXPECTED_FILE: ${{ steps.target.outputs.file_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_ID" =~ ^[0-9]+$ ]]
          curl --fail-with-body --silent --show-error --retry 2 --header "apikey: $NEXUS_API_KEY" "https://api.nexusmods.com/v3/mod-file-versions/$VERSION_ID" --output uploaded.json
          jq -e --arg version "$EXPECTED_VERSION" --arg file "$EXPECTED_FILE" '.data.version == $version and (.data.file.id | tostring) == $file' uploaded.json
          printf 'Verified Nexus version %s (%s), file %s.\n' "$EXPECTED_VERSION" "$VERSION_ID" "$EXPECTED_FILE" >> "$GITHUB_STEP_SUMMARY"
