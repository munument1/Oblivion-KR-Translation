name: Canonical and reviewed-source inventory
on:
  push:
    paths:
      - 'scripts/inspect_translation_sources.py'
      - '.github/workflows/canonical-v2-inventory.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory reviewed provenance and schema
        run: python scripts/inspect_translation_sources.py
      - name: Store read-only schema report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/translation_memory/source_schema_inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "Record canonical versus reviewed translation source metadata"
            git push origin HEAD:main
          fi
