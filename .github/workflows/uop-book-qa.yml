name: UOP Book Restoration QA

on:
  push:
    paths:
      - 'build_unofficial_release.py'
      - 'uop_book_restoration.py'
      - 'uop_book_body_restore_v1.csv'
      - 'uop_book_reviewed_override_v1.csv'
      - 'canonical_translation_v2.csv'
      - 'canonical_unofficial_translation_v2.csv'
      - 'tests/test_uop_book_restoration.py'
      - 'tests/test_unofficial_forwarding.py'
      - 'build_shrine_messages.py'
      - 'package_obcjk_unofficial.py'
      - 'tests/test_shrine_messages.py'
      - 'tests/test_unofficial_package.py'
      - '.github/workflows/uop-book-qa.yml'
  pull_request:
    paths:
      - 'build_unofficial_release.py'
      - 'uop_book_restoration.py'
      - 'uop_book_body_restore_v1.csv'
      - 'uop_book_reviewed_override_v1.csv'
      - 'canonical_translation_v2.csv'
      - 'canonical_unofficial_translation_v2.csv'
      - 'tests/test_uop_book_restoration.py'
      - 'tests/test_unofficial_forwarding.py'
      - 'build_shrine_messages.py'
      - 'package_obcjk_unofficial.py'
      - 'tests/test_shrine_messages.py'
      - 'tests/test_unofficial_package.py'
      - '.github/workflows/uop-book-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uop-book-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all 112 UOP restored books and source fingerprints
        run: python -m unittest discover -s tests -p 'test_uop_book_restoration.py' -v
      - name: Verify existing unofficial-patch forwarding behavior
        run: python -m unittest discover -s tests -p 'test_unofficial_forwarding.py' -v
      - name: Verify wayshrine bytecode and root-level ESP packages
        run: |
          python -m unittest discover -s tests -p 'test_shrine_messages.py' -v
          python -m unittest discover -s tests -p 'test_unofficial_package.py' -v
      - name: Correct four verified Fur armor translations and push reviewed CSV
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,io
          from oblivion_korean_codec import encode_legacy,decode_legacy
          target=Path('canonical_translation_v2.csv')
          fixed={
              '00024765': ('Fur Gauntlets','털가죽 장갑','모피 장갑'),
              '00024767': ('Fur Boots','털가죽 전투화','모피 전투화'),
              '00024768': ('Fur Helmet','털가죽 투구','모피 투구'),
              '000733E2': ('Fur Helmet','털가죽 투구','모피 투구'),
          }
          source=target.read_bytes()
          chunks=source.splitlines(keepends=True)
          header=next(csv.reader([chunks[0].decode('utf-8-sig').rstrip('\r\n')]))
          required={'effective_source','record_type','raw_formid','field','old_english','new_korean','new_bytes_hex','obcjk_unicode_text','obcjk_utf8_hex'}
          if not required.issubset(set(header)): raise ValueError('Unexpected canonical translation schema')
          changed={}
          for i,line in enumerate(chunks):
              if b',ARMO,' not in line or not any(fid.encode() in line for fid in fixed):
                  continue
              ending=b'\r\n' if line.endswith(b'\r\n') else b'\n' if line.endswith(b'\n') else b''
              body=line[:-len(ending)] if ending else line
              values=next(csv.reader([body.decode('utf-8')]))
              if len(values)!=len(header): raise ValueError('Ambiguous target CSV row')
              row=dict(zip(header,values))
              fid=row['raw_formid']
              if fid not in fixed: continue
              if fid in changed: raise ValueError('Duplicate target '+fid)
              oldenglish,oldko,newko=fixed[fid]
              if (row['effective_source'],row['record_type'],row['field'],row['old_english'],row['new_korean']) != ('Oblivion.esm','ARMO','FULL',oldenglish,oldko):
                  raise ValueError('Source identity changed for '+fid)
              if row['obcjk_unicode_text']!=oldko or bytes.fromhex(row['obcjk_utf8_hex'])!=oldko.encode('utf-8')+b'\0':
                  raise ValueError('Old UTF-8 target mismatch '+fid)
              if bytes.fromhex(row['new_bytes_hex'])!=encode_legacy(oldko)+b'\0':
                  raise ValueError('Old legacy target mismatch '+fid)
              updates={
                  'new_korean':newko,
                  'obcjk_unicode_text':newko,
                  'obcjk_utf8_hex':(newko.encode('utf-8')+b'\0').hex(),
                  'new_bytes_hex':(encode_legacy(newko)+b'\0').hex(),
              }
              for field,value in updates.items():values[header.index(field)]=value
              dst=io.StringIO(newline='')
              csv.writer(dst,lineterminator='').writerow(values)
              chunks[i]=dst.getvalue().encode('utf-8')+ending
              changed[fid]=(oldko,newko)
          if set(changed)!=set(fixed): raise ValueError('Missing target Fur rows: '+repr(set(fixed)-set(changed)))
          updated=b''.join(chunks)
          if source==updated:raise ValueError('No changes')
          target.write_bytes(updated)
          print('VERIFIED_CSV_CORRECTIONS',changed)
          PY
          python -m unittest discover -s tests -p 'test_nexus_56688_translation_fixes.py' -v
          python -m unittest discover -s tests -p 'test_uop_book_restoration.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canonical_translation_v2.csv
          git diff --cached --stat
          git commit -m 'fix: normalize four Fur armor names and UTF-8/legacy encodings'
          git push origin HEAD:fix/nexus-56688-oct23-qa
