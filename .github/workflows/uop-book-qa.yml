name: UOP Book Restoration QA

on:
  push:
    paths:
      - 'build_unofficial_release.py'
      - 'uop_book_restoration.py'
      - 'uop_book_body_restore_v1.csv'
      - 'canonical_translation_v2.csv'
      - 'canonical_unofficial_translation_v2.csv'
      - 'tests/test_uop_book_restoration.py'
      - 'tests/test_unofficial_forwarding.py'
      - 'build_shrine_messages.py'
      - 'package_obcjk_unofficial.py'
      - 'tests/test_shrine_messages.py'
      - 'tests/test_unofficial_package.py'
      - '.github/workflows/uop-book-qa.yml'
  pull_request:
    paths:
      - 'build_unofficial_release.py'
      - 'uop_book_restoration.py'
      - 'uop_book_body_restore_v1.csv'
      - 'canonical_translation_v2.csv'
      - 'canonical_unofficial_translation_v2.csv'
      - 'tests/test_uop_book_restoration.py'
      - 'tests/test_unofficial_forwarding.py'
      - 'build_shrine_messages.py'
      - 'package_obcjk_unofficial.py'
      - 'tests/test_shrine_messages.py'
      - 'tests/test_unofficial_package.py'
      - '.github/workflows/uop-book-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uop-book-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all 112 UOP restored books and source fingerprints
        run: python -m unittest discover -s tests -p 'test_uop_book_restoration.py' -v
      - name: Verify existing unofficial-patch forwarding behavior
        run: python -m unittest discover -s tests -p 'test_unofficial_forwarding.py' -v
      - name: Verify wayshrine bytecode and root-level ESP packages
        run: |
          python -m unittest discover -s tests -p 'test_shrine_messages.py' -v
          python -m unittest discover -s tests -p 'test_unofficial_package.py' -v
      - name: Compare exact UOP book source identity
        run: |
          python - <<'PY'
          import csv,hashlib,difflib
          rows=[]
          for filename in ('canonical_translation_v2.csv','canonical_unofficial_translation_v2.csv'):
              with open(filename,encoding='utf-8-sig',newline='') as f:
                  for row in csv.DictReader(f):
                      if row.get('raw_formid','').upper()=='00024564' and row.get('record_type')=='BOOK' and row.get('field')=='DESC':
                          txt=row['old_english']; k=row['new_korean']
                          print('SOURCE',filename,row['effective_source'],'ENlen',len(txt),'ENhash',hashlib.sha256(txt.encode('cp1252')+b'\\0').hexdigest(),'KOlen',len(k),'EDID',row['editor_id'],'occ',row['occurrence'])
                          rows.append((filename,txt,k))
          if len(rows)==2:
              a,b=rows
              print('SOURCE_EQUAL',a[1]==b[1])
              print('DIFF',list(difflib.unified_diff(a[1].splitlines(),b[1].splitlines(),n=0))[:16])
              print('BASE_KOREAN_PREFIX',repr(a[2][:150]))
          PY
