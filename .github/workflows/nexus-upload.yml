name: Upload installer to Nexus Mods

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag
        required: true
        default: v1.1.9
        type: string
      changelog:
        description: Nexus changelog for this version
        required: true
        default: '이슈 #6: 루시엔 대사 어투, 아레나 계급명, 마법사 길드 명칭, 라셰다 이름, 채집 재료 표기를 수정하고 책·상점 전단의 줄바꿈 태그를 보정했습니다. xOBSE 22.14 이후 한글 물음표 현상은 obCJK 2026-10-29 Optional DLL을 별도로 설치하면 해결됩니다. 새 설치기로 본편 번역 모드를 재생성하고 UOP KR1.12·USIP KR1.9를 함께 갱신하세요. MOO 수배서는 수정하지 않았습니다.'
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-installer-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify published installer
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          version="${RELEASE_TAG#v}"
          filename="Oblivion_Original_KR_Installer_v${version}.zip"
          gh release download "$RELEASE_TAG" --pattern "$filename" --pattern "$filename.sha256"
          sha256sum --check "$filename.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Update existing Nexus installer and mod version
        id: nexus
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8110293'
          mod_id: '433791753584'
          filename: ${{ steps.release.outputs.filename }}
          version: ${{ steps.release.outputs.version }}
          display_name: Oblivion Original KR Installer
          description: ${{ inputs.changelog }}
          changelog: ${{ inputs.changelog }}
          category: main
          archive_existing_version: 'false'
          primary_mod_manager_download: 'true'
          allow_mod_manager_download: 'true'
          update_mod_version: 'true'

      - name: Record result
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NEXUS_VERSION_ID: ${{ steps.nexus.outputs.version_id }}
        shell: bash
        run: |
          printf 'Uploaded installer %s to Nexus Mods.\n\nVersion ID: %s\n\nhttps://www.nexusmods.com/oblivion/mods/56688?tab=files\n' "$VERSION" "$NEXUS_VERSION_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify uploaded Nexus version through API
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_FILE: 8110293
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_ID" =~ ^[0-9]+$ ]]
          curl --fail-with-body --silent --show-error --retry 2 --header "apikey: $NEXUS_API_KEY" "https://api.nexusmods.com/v3/mod-file-versions/$VERSION_ID" --output uploaded.json
          jq -e --arg version "$EXPECTED_VERSION" --arg file "$EXPECTED_FILE" '.data.version == $version and (.data.file.id | tostring) == $file' uploaded.json
          printf 'Verified Nexus version %s (%s), file %s.\n' "$EXPECTED_VERSION" "$VERSION_ID" "$EXPECTED_FILE" >> "$GITHUB_STEP_SUMMARY"
